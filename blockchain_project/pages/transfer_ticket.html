    <!-- Web3 SECOND -->
    <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js/dist/web3.min.js"></script>

    <!-- Config -->
    <script src="../assets/js/config.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/site.css">

    <title>
        Transfer Ticket — Block 8 Ticketing
    </title>

<body>

     <nav class="site-nav" aria-label="Main">
            <a class="brand" href="../index.html">Blockchain Technologies &amp; Applications · Block 8</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="create_wallet.html">Create Wallet</a>
                <a href="check_balance.html">Check Balance</a>
                <a href="buy_ticket.html">Buy Ticket</a>
                <a href="transfer_ticket.html">Transfer to Vendor</a>
            </div>
        </nav>

<main class="site-main">


    <h1>Transfer Ticket</h1>

    <input
        type="file"
        id="keystoreFile"
        accept=".json,application/json">

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="off">

    <br><br>

    <button id="loadWalletButton">
        Load Wallet
    </button>

    <br><br>

    <input
        type="text"
        id="walletAddress"
        placeholder="Wallet Address"
        readonly>

    <br><br>

    <button id="transferButton">
        Transfer Ticket
    </button>

    <!-- Shared modal -->
    <div id="errorModal" class="modal">

        <div class="modal-content">

            <span id="closeModal" class="close">
                &times;
            </span>

            <p id="errorMessage"></p>

        </div>

    </div>

</main>

<!-- Page logic LAST -->
<script src="../assets/js/transfer_ticket.js"></script>

</body>
