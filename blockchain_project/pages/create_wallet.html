<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Include the Web3 library -->
    <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js/dist/web3.min.js"></script>
    <!-- Include the jQuery library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- Include your CSS file -->
     <!-- REQUIRED ORDER -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/web3_init.js"></script>

    <link rel="stylesheet" href="../assets/css/site.css">
    <link rel="stylesheet" href="../assets/css/create_wallet.css">
    <title>Create a wallet</title>

</head>
<body>
        <nav class="site-nav" aria-label="Main">
            <a class="brand" href="../index.html">Blockchain Technologies &amp; Applications · Block 8</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="create_wallet.html">Create Wallet</a>
                <a href="check_balance.html">Check Balance</a>
                <a href="buy_ticket.html">Buy Ticket</a>
                <a href="transfer_ticket.html">Transfer to Vendor</a>
            </div>
        </nav>

        <main class="site-main">
        <h1>Create a Wallet</h1>
        <button id="createWalletButton">Create Wallet</button>
        <!-- Ask for a wallet password -->
        <input type="password" id="password" placeholder="Enter a password for the Key Store">
        <br/>
        <br/>

        <label for="walletAddress">Wallet Address:</label>
        <br/>
        <textarea id="walletAddress" rows="5" cols="50"></textarea>
        <br/>
        <label for="privateKey">Private Key:</label>
        <br/>
        <textarea id="privateKey" rows="5" cols="50"></textarea>
        <br/>
        <label for="keystore">Keystore File:</label>
        <br/>
        <textarea id="keystore" rows="5" cols="50"></textarea>
    
        <br/>
        <br/>
        <!-- Download the keystore as a file {wallet}.json -->
        <a class="btn" id="downloadKeystore" download="wallet.json">Download Keystore</a>

</main>
</body>
<script src="../assets/js/create_wallet.js"></script>
</html>
